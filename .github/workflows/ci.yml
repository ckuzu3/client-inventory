name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Lint, type check and the full suite on in-memory SQLite. Two Python versions,
  # because the project claims to support both.
  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Type check
        run: mypy

      - name: Test
        run: pytest --cov --cov-report=term-missing --junitxml=testresults/junit.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results-${{ matrix.python-version }}
          path: backend/testresults/
          if-no-files-found: warn

  # The same suite against a real PostgreSQL. The tests pick up the database from
  # CLIENT_INVENTORY_TEST_DATABASE_URL, so this job is what turns "it also works on
  # PostgreSQL" from a claim into something that was actually run.
  backend-postgres:
    name: Backend on PostgreSQL
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: inventory
          POSTGRES_PASSWORD: inventory
          POSTGRES_DB: inventory
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U inventory -d inventory"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      CLIENT_INVENTORY_TEST_DATABASE_URL: postgresql+psycopg://inventory:inventory@localhost:5432/inventory

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        run: pip install -e ".[dev,postgres]"

      - name: Apply migrations
        env:
          CLIENT_INVENTORY_DATABASE_URL: postgresql+psycopg://inventory:inventory@localhost:5432/inventory
        run: alembic upgrade head

      - name: Test
        run: pytest --cov --cov-report=term-missing

  # The frontend is checked the same way the backend is: lint, types, tests, build.
  # Angular 22 runs its tests on Vitest with jsdom, so no browser is needed here.
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
